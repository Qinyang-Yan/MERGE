[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-biomaterials"
version = "1.0.0"
description = "MERGE: Metal Electrochemical-Response Gene Embedding for transcriptional response prediction"
authors = [{name = "Qinyang Yan"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.1",
  "numpy>=1.23,<2.0",
  "pandas>=2.0,<3.0",
  "scipy>=1.10,<2.0",
  "scikit-learn>=1.2,<2.0",
  "anndata>=0.9,<1.0",
  "scanpy>=1.9,<2.0",
  "scikit-misc>=0.3",
  "h5py>=3.8,<4.0",
  "omegaconf>=2.3,<3.0",
  "tabulate>=0.9",
  "transformers==4.41.2",
]

[project.urls]
Repository = "https://github.com/Qinyang-Yan/MERGE"
Issues = "https://github.com/Qinyang-Yan/MERGE/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9.0",
  "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["merge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
