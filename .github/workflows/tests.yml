name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install MERGE and test dependencies
        run: python -m pip install '.[dev]'
      - name: Verify installed package
        run: python -c "import merge; import merge.data; print(merge.__file__)"
      - name: Run tests
        run: python -m pytest -q
